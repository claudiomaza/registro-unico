<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Entrada a Registro Único"><title>Registro Único</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f8;color:#172027;font:16px system-ui,sans-serif}.card{width:min(92vw,520px);padding:32px;border:1px solid #dde5e8;border-radius:18px;background:#fff;box-shadow:0 8px 28px #1c34400b}.brand{font-size:1.8rem;font-weight:750;letter-spacing:-.04em}.muted{color:#63727b;line-height:1.55}.button{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:9px;background:#087e69;color:white;text-decoration:none;font-weight:700}.note{font-size:.9rem;color:#51616a;margin-top:20px}.button:disabled{opacity:.6;cursor:not-allowed;border:0;font:inherit}</style></head>
